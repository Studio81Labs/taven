# ported from Studio81Labs/tabletap@a36cebcd
name: Prune Stale Caches

# Deletes superseded Actions caches on refs/heads/main.
#
# Why this is separate from cleanup-pr-caches.yml. That one deletes the caches
# a PULL REQUEST created, once it closes, because the ref becomes unreachable.
# Nothing deleted superseded caches on main, and those are a different shape:
# the ref stays reachable forever, but the KEY does not. Every content-hash
# cache — node modules keyed by lockfile, Gradle keyed by the build files —
# writes a fresh entry on each change and leaves the previous one behind,
# reachable and permanently useless.
#
# What that costs. GitHub gives a repo 10 GB and evicts least-recently-used
# above it. Measured on 2026-08-18: nexcue had TEN node-cache entries on main
# going back six days, 3.19 GB of the quota, of which one was live. Adding a
# Gradle cache (~3.3 GB) pushed the store to 10.47 GB, and the two
# least-recently-used large entries were the Flutter SDK caches every mobile
# run restores. Evicting those to store a Gradle cache is a straight loss, and
# it presents as "the new cache didn't help" rather than as an error.
#
# The rule: keep the exact key AND internal cache version current main can
# request per family, drop the rest. A family is the key with its trailing
# content hashes stripped, so
# `node-cache-Linux-x64-pnpm-<hash>` collapses to `node-cache-Linux-x64-pnpm`
# and only the key carrying current main's lockfile hash survives. Neither
# creation nor access time proves that: rerunning an old revision can recreate
# or restore its obsolete key later. Deleting a superseded content-hash key
# costs nothing measurable because it is a key current main cannot request.
#
# NOT handled here, deliberately: action-managed families whose exact current
# key cannot be derived from repository inputs (setup-java and ruby/setup-ruby)
# are left untouched rather than guessed at. A whole family going obsolete is
# also out of scope. The Flutter
# version is part of its family name (`flutter-linux-stable-3.41.9-x64`), so
# bumping the pin starts a new family and leaves the old one intact as its own
# single entry — around 1.7 GB per superseded SDK. Both repos are on one
# version today, so there is nothing to collect; when that changes, the fix is
# to read the pin from renovate.json and drop families that do not match it.

on:
  schedule:
    # Daily, early. Sprawl accumulates over days rather than hours, and a daily
    # sweep keeps the store clear of the point where a Gradle cache cannot be
    # saved without evicting an SDK.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One sweep at a time. Two concurrent runs would race on the same delete and
  # log spurious failures for entries the other already removed.
  group: prune-stale-caches
  cancel-in-progress: false

jobs:
  prune:
    name: "ci: prune superseded caches"
    runs-on: ubuntu-latest
    permissions:
      # Scoped to this job: checkout reads current main, then the pruner writes
      # only Actions cache state.
      contents: read
      actions: write
    steps:
      - name: Checkout current main cache inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Resolve current pnpm cache path
        run: echo "CURRENT_PNPM_CACHE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Resolve current Flutter cache inputs
        if: hashFiles('apps/mobile/pubspec.yaml') != ''
        env:
          CURRENT_GRADLE_HASH: ${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          CURRENT_COCOAPODS_HASH: ${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          CURRENT_SPM_HASH: ${{ hashFiles('apps/mobile/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        run: |
          {
            echo "CURRENT_GRADLE_HASH=$CURRENT_GRADLE_HASH"
            echo "CURRENT_COCOAPODS_HASH=$CURRENT_COCOAPODS_HASH"
            echo "CURRENT_SPM_HASH=$CURRENT_SPM_HASH"
          } >> "$GITHUB_ENV"

      - name: Delete superseded main-branch caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          # Evaluated after the explicit main checkout. This is the same
          # hashFiles input used by setup-node; an old rerun cannot change it.
          # Flutter-specific hashes enter through GITHUB_ENV only when the
          # checked-out tree proves that capability exists.
          CURRENT_PNPM_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import collections, hashlib, json, os, re, subprocess

          repo = os.environ["REPO"]
          dry = os.environ.get("DRY_RUN") == "true"

          def api(*args):
              return subprocess.run(["gh", "api", *args], capture_output=True, text=True)

          # --paginate, because `per_page=100` alone caps this sweep at the
          # first 100 entries and the store this job protects is exactly what
          # grows past that. The under-collection is silent: the job succeeds
          # and prints what it deleted, which reads as proof the store is clean.
          #
          # --jq rather than a bare --paginate, because `gh` CONCATENATES the
          # JSON document from each page instead of merging them, so a
          # `json.loads` over the whole stdout dies with "Extra data" on the
          # second page. Applying jq per page emits one cache object per line,
          # which parses cleanly and drops the page envelope this script never
          # wanted. (`--slurp` would also work and `gh` refuses it alongside
          # `--jq`.)
          out = api(
              "--paginate",
              f"repos/{repo}/actions/caches?per_page=100",
              "--jq", ".actions_caches[]",
          )
          if out.returncode != 0:
              # Fail loudly. A silent skip here looks exactly like "nothing to
              # prune", which is the state this job exists to prevent.
              print(f"::error::could not list caches: {out.stderr.strip()}")
              raise SystemExit(1)
          caches = [json.loads(line) for line in out.stdout.splitlines() if line.strip()]

          # A trailing hash is 16+ hex characters. The threshold matters: the
          # keys here also carry short non-hash segments (`x64`, `arm64`,
          # `pnpm`, `3.41.9`), and a looser rule would eat those and merge
          # families that must stay distinct — collapsing linux and macos SDK
          # caches into one family would delete a platform's only entry.
          HASH = re.compile(r"-[0-9a-f]{16,}$")

          def family(key):
              while HASH.search(key):
                  key = HASH.sub("", key)
              return key

          current_hashes = {
              "pnpm": os.environ.get("CURRENT_PNPM_HASH", ""),
              "gradle": os.environ.get("CURRENT_GRADLE_HASH", ""),
              "cocoapods": os.environ.get("CURRENT_COCOAPODS_HASH", ""),
              "spm": os.environ.get("CURRENT_SPM_HASH", ""),
          }

          # Cache identity is (key, version), not key alone. Both pinned cache
          # implementations derive version as sha256(paths + compression +
          # salt); this mirrors actions/cache@v6.1.0 and the cache toolkit
          # vendored by actions/setup-node@v7.0.0. Their getVersion helper runs
          # exactly `zstd --quiet --version`, combines stdout/stderr, and uses
          # zstd-without-long for every non-empty result. Mirror that behavior
          # rather than inferring a token merely from the executable's path.
          # If those action pins change the algorithm, update this alongside
          # their digest pin.
          try:
              zstd = subprocess.run(
                  ["zstd", "--quiet", "--version"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              zstd_version = (zstd.stdout + zstd.stderr).strip()
          except OSError:
              zstd_version = ""
          compression = "zstd-without-long" if zstd_version else "gzip"

          def cache_version(*paths):
              components = [*paths, compression, "1.0"]
              return hashlib.sha256("|".join(components).encode()).hexdigest()

          pnpm_linux_path = os.environ["CURRENT_PNPM_CACHE_PATH"]
          linux_home = "/home/runner/"
          if not pnpm_linux_path.startswith(linux_home):
              print(
                  "::error::cannot derive hosted macOS pnpm cache path from "
                  f"{pnpm_linux_path}"
              )
              raise SystemExit(1)
          # pnpm/action-setup installs under the hosted runner home on both
          # platforms. Preserve the path suffix resolved by the pinned pnpm
          # itself; only the GitHub-hosted home prefix differs.
          pnpm_macos_path = pnpm_linux_path.replace(
              linux_home, "/Users/runner/", 1
          )

          current_versions = {
              "pnpm-linux": cache_version(pnpm_linux_path),
              "pnpm-macos": cache_version(pnpm_macos_path),
              "gradle": cache_version("~/.gradle/caches", "~/.gradle/wrapper"),
              "cocoapods": cache_version(
                  "apps/mobile/ios/Pods",
                  "~/Library/Caches/CocoaPods",
                  "~/.cocoapods",
              ),
              "spm": cache_version("~/Library/Caches/org.swift.swiftpm"),
          }

          def managed_kind(key):
              if key.startswith("node-cache-Linux-") and "-pnpm-" in key:
                  return "pnpm-linux"
              if key.startswith("node-cache-macOS-") and "-pnpm-" in key:
                  return "pnpm-macos"
              for prefix, kind in (
                  ("gradle-", "gradle"),
                  ("cocoapods-", "cocoapods"),
                  ("spm-", "spm"),
              ):
                  if key.startswith(prefix):
                      return kind
              # No current workflow creates pnpm caches on another runner OS.
              # Leave unknown families untouched instead of guessing at an
              # OS-specific store path or cache-version salt.
              return None

          def source_hash(kind):
              return current_hashes[
                  "pnpm" if kind in {"pnpm-linux", "pnpm-macos"} else kind
              ]

          def current_kind(key):
              kind = managed_kind(key)
              if kind is None:
                  return None
              digest = source_hash(kind)
              suffix = f"-pnpm-{digest}" if kind.startswith("pnpm-") else f"-{digest}"
              return kind if bool(digest) and key.endswith(suffix) else None

          def is_current(cache):
              kind = current_kind(cache["key"])
              return bool(kind) and cache.get("version") == current_versions[kind]

          def select_keep(items):
              exact = [cache for cache in items if is_current(cache)]
              if exact:
                  return exact, "exact current-main key/version(s)"
              kinds = {managed_kind(cache["key"]) for cache in items}
              if len(kinds) != 1 or None in kinds:
                  return [], "unmanaged or mixed family"
              kind = next(iter(kinds))
              if not source_hash(kind):
                  return [], "capability has no current source input"
              # The new source-derived cache may not have been saved yet. Keep
              # one immutable newest fallback so quota pressure cannot preserve
              # every obsolete entry and prevent that cache from being created.
              newest = max(items, key=lambda cache: (cache["created_at"], cache["id"]))
              return [newest], "newest fallback while current cache is absent"

          # Regression: pnpm store paths, and therefore versions, differ by
          # runner OS even when the visible lockfile-derived key suffix agrees.
          for platform, architecture, kind in (
              ("Linux", "x64", "pnpm-linux"),
              ("macOS", "arm64", "pnpm-macos"),
          ):
              sample_key = (
                  f"node-cache-{platform}-{architecture}-pnpm-"
                  f"{current_hashes['pnpm']}"
              )
              assert is_current(
                  {"key": sample_key, "version": current_versions[kind]}
              )
              assert not is_current(
                  {"key": sample_key, "version": "0" * 64}
              )

          fallback_fixture = [
              {
                  "id": 1,
                  "key": f"node-cache-Linux-x64-pnpm-{'a' * 64}",
                  "version": "0" * 64,
                  "created_at": "2026-01-01T00:00:00Z",
              },
              {
                  "id": 2,
                  "key": f"node-cache-Linux-x64-pnpm-{'b' * 64}",
                  "version": "0" * 64,
                  "created_at": "2026-02-01T00:00:00Z",
              },
          ]
          fallback_keep, fallback_reason = select_keep(fallback_fixture)
          assert [cache["id"] for cache in fallback_keep] == [2]
          assert fallback_reason.startswith("newest fallback")

          groups = collections.defaultdict(list)
          for c in caches:
              # main only. PR refs belong to cleanup-pr-caches.yml, and taking
              # them here would delete a cache out from under a running job.
              if c["ref"] == "refs/heads/main":
                  groups[family(c["key"])].append(c)

          protected = [
              c
              for items in groups.values()
              for c in items
              if is_current(c)
          ]
          print(
              f"::notice::found {len(protected)} source-derived current-main "
              "cache key/version(s)"
          )

          doomed, freed = [], 0
          for fam, items in sorted(groups.items()):
              if len(items) < 2:
                  continue
              keep, keep_reason = select_keep(items)
              if not keep:
                  print(
                      f"{fam}: {len(items)} entries, {keep_reason}; "
                      "leaving this family untouched"
                  )
                  continue
              kept_ids = {cache["id"] for cache in keep}
              rest = [cache for cache in items if cache["id"] not in kept_ids]
              print(
                  f"{fam}: {len(items)} entries, keeping {len(keep)} "
                  f"{keep_reason}"
              )
              for c in rest:
                  doomed.append(c)
                  freed += c["size_in_bytes"]

          if not doomed:
              print("Nothing superseded. Store is clean.")
          for c in doomed:
              gb = c["size_in_bytes"] / 2**30
              if dry:
                  print(f"  would delete {gb:.2f} GB  {c['key'][:56]}")
                  continue
              r = api("-X", "DELETE", f"repos/{repo}/actions/caches/{c['id']}")
              if r.returncode == 0:
                  print(f"  deleted {gb:.2f} GB  {c['key'][:56]}")
              elif "(HTTP 404)" in r.stderr:
                  # Confirmed race: eviction or another cleanup already
                  # achieved the desired end state after enumeration.
                  print(f"  already gone {gb:.2f} GB  {c['key'][:56]}")
              else:
                  print(f"::error::could not delete cache {c['id']}: {r.stderr.strip()}")
                  raise SystemExit(1)

          verb = "would reclaim" if dry else "reclaimed"
          print(f"::notice::{verb} {freed / 2**30:.2f} GB across {len(doomed)} superseded cache(s)")

          usage = api(f"repos/{repo}/actions/cache/usage")
          if usage.returncode == 0:
              size = json.loads(usage.stdout)["active_caches_size_in_bytes"] / 2**30
              # The usage endpoint is eventually consistent and lags a sweep by
              # minutes, so this is the PRE-prune figure on a run that deleted
              # anything. Still worth printing: it is the number that matters,
              # and a run reporting 8 GB+ after a clean sweep means the live
              # caches alone no longer fit comfortably.
              print(f"::notice::store reported at {size:.2f} GB of 10 GB (lags this sweep)")
          PY
