# ported from Studio81Labs/nexcue@314cec8972589780072e641591b16eca9805d7dd
name: Lint PR

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

jobs:
  validate:
    name: "ci: pull request title"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            ci
            build
            revert
          scopes: |
            admin
            backend
            web
            worker
            core
            contract
            ui-web
            ci
            infra
            docs
            deps
            repo
          requireScope: true
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject must start with a lower-case character and match
            Taven's conventional-commit policy.
