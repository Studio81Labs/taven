# ported from Studio81Labs/nexcue@314cec8972589780072e641591b16eca9805d7dd
name: Backend CI

on:
  push:
    branches: [main]
    paths: &backend-paths
      - "apps/backend/**"
      - "packages/core/**"
      - "packages/slicer-contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".nvmrc"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths: *backend-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "backend: lint, typecheck, test & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm backend:lint
      - run: pnpm backend:typecheck
      - run: pnpm backend:test
      - run: pnpm backend:build

  test-e2e:
    name: "backend: e2e (real postgres)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: taven
          POSTGRES_DB: taven_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taven"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://taven@localhost:5432/taven_test
      TAVEN_S3_ENDPOINT: http://127.0.0.1:9000
      TAVEN_S3_REGION: us-east-1
      TAVEN_S3_BUCKET: taven-test
      TAVEN_S3_ACCESS_KEY_ID: taven-test
      TAVEN_S3_SECRET_ACCESS_KEY: taven-test-local-only
      TAVEN_S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO test storage
        run: |
          docker run --detach --name taven-minio-test --publish 9000:9000 \
            --env MINIO_ROOT_USER="$TAVEN_S3_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$TAVEN_S3_SECRET_ACCESS_KEY" \
            minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 \
            -c "mc alias set local '$TAVEN_S3_ENDPOINT' '$TAVEN_S3_ACCESS_KEY_ID' '$TAVEN_S3_SECRET_ACCESS_KEY' && mc mb --ignore-existing 'local/$TAVEN_S3_BUCKET'"
      - run: pnpm -C apps/backend db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm -C apps/backend db:seed
      - run: pnpm backend:test:e2e
