# ported from Studio81Labs/nexcue@314cec8972589780072e641591b16eca9805d7dd
name: Backend CI

on:
  push:
    branches: [main]
    paths: &backend-paths
      - "apps/backend/**"
      - "apps/slicer-worker/src/object-store*"
      - "apps/slicer-worker/package.json"
      - "infra/coolify/retention-grants.sql"
      - "packages/core/**"
      - "packages/slicer-contracts/**"
      - "scripts/ci/check-boundaries.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".nvmrc"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths: *backend-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "backend: lint, typecheck, test & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm backend:lint
      - run: pnpm boundaries:check
      - run: pnpm backend:typecheck
      - run: pnpm backend:test
      - run: pnpm backend:build

  test-e2e:
    name: "backend: e2e (real postgres)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: taven
          POSTGRES_DB: taven_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taven"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://taven@localhost:5432/taven_test
      TAVEN_REDIS_URL: redis://localhost:6379
      TAVEN_S3_ENDPOINT: http://127.0.0.1:9000
      TAVEN_S3_REGION: us-east-1
      TAVEN_S3_BUCKET: taven-test
      TAVEN_S3_ACCESS_KEY_ID: taven-test
      TAVEN_S3_SECRET_ACCESS_KEY: taven-test-local-only
      TAVEN_S3_FORCE_PATH_STYLE: "true"
      TAVEN_UPLOAD_CLIENT_HASH_KEY: test-only-upload-client-hash-key-32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Silo S3 test storage
        run: |
          docker run --detach --name taven-minio-test --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER="$TAVEN_S3_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$TAVEN_S3_SECRET_ACCESS_KEY" \
            --env MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:3000 \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          docker exec taven-minio-test mcli alias set local \
            http://127.0.0.1:9000 "$TAVEN_S3_ACCESS_KEY_ID" "$TAVEN_S3_SECRET_ACCESS_KEY"
          docker exec taven-minio-test mcli mb "local/$TAVEN_S3_BUCKET"
      - run: pnpm -C apps/backend db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm -C apps/backend db:seed
      - run: pnpm backend:test:e2e
      - run: pnpm -C apps/slicer-worker test:storage:integration
