name: Coolify configuration

on:
  push:
    branches: [main]
    paths: &paths
      - "infra/coolify/**"
      - "scripts/ci/coolify-compose.test.mjs"
      - ".github/workflows/coolify-config.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/ci/coolify-compose.test.mjs
