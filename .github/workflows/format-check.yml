name: Format Check

# Enforces Prettier across the repo.
#
# Why this exists. Prettier was configured in both siblings but enforced only by
# lint-staged, which sees STAGED files in a local commit -- so anything landing
# another way (an edit through the GitHub UI, a `--no-verify` commit, a bot
# writing a file) was never formatted and nothing noticed. Measured on
# 2026-08-18: 18 tracked files had drifted here and 48 in nexcue, mostly docs but
# including real source in both. That is what an unenforced formatter looks like
# after a few months.
#
# It runs on every pull request on purpose: a path filter would have to list
# every extension Prettier owns, and the failure mode of getting that list wrong
# is silent (the file drifts and no job claims it). The job is ~25s -- it fetches
# a single package rather than installing the workspace, which matters because
# the Actions budget is shared across all Studio81Labs repos.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Per-commit, matching security-scan.yml: with a branch-level group, merges
  # landing in quick succession cancel each other and a commit goes unchecked.
  group: format-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: "ci: formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check formatting
        run: |
          set -euo pipefail
          # Resolve the exact, lockfile-aligned version from package.json rather
          # than hardcoding a second copy here. `npx` fetches just this package
          # instead of installing the workspace.
          VERSION="$(node -p "require('./package.json').devDependencies.prettier")"
          # Fail loudly on an empty read. `npx prettier@ --check` is valid
          # syntax that silently installs the LATEST prettier, so a renamed or
          # moved dependency would turn this job into a check against a version
          # the repo does not use -- passing or failing for reasons no one can
          # reproduce locally.
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::Could not read devDependencies.prettier from package.json"
            exit 1
          fi
          # A range such as ^3.9.6 makes npx resolve the newest matching release,
          # bypassing the lockfile and formatting differently from local pnpm.
          # Keep the manifest exact; Renovate updates it and the lock together.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::devDependencies.prettier must be an exact version, found ${VERSION}"
            exit 1
          fi
          echo "Using prettier ${VERSION} (from package.json)"
          npx --yes "prettier@${VERSION}" --check .
