# ported from Studio81Labs/nexcue@314cec8972589780072e641591b16eca9805d7dd
name: Format Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: format-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: "ci: formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check formatting
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').devDependencies.prettier")"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::Could not read devDependencies.prettier from package.json"
            exit 1
          fi
          npx --yes "prettier@${VERSION}" --check .
