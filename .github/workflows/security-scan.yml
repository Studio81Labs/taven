# ported from Studio81Labs/nexcue@314cec8972589780072e641591b16eca9805d7dd
name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog:3.96.0@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577
  OSV_IMAGE: ghcr.io/google/osv-scanner:v2.5.0@sha256:5b8b38e45bb2c5c4976f0f1f07860551ea6e1f235f642cf215f74d266fec2c1b

jobs:
  secrets:
    name: "security: secrets"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan pull request range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            "$TRUFFLEHOG_IMAGE" git file:///repo \
            --results=verified,unknown --since-commit "$BASE_SHA" --branch "$HEAD_SHA" \
            --fail --no-update --github-actions

      - name: Scan pushed range
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            "$TRUFFLEHOG_IMAGE" git file:///repo \
            --results=verified,unknown --since-commit "$BASE_SHA" --branch "$HEAD_SHA" \
            --fail --no-update --github-actions

      - name: Scan full history
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            "$TRUFFLEHOG_IMAGE" git file:///repo \
            --results=verified --fail --no-update --github-actions

  dependencies:
    name: "security: dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Validate pnpm overrides
        run: node scripts/ci/check-pnpm-overrides.mjs
      - name: OSV Scanner
        run: |
          set -euo pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src \
            "$OSV_IMAGE" scan source --recursive ./
