name: Web CI

on:
  push:
    branches: [main]
    paths: &web-paths
      - "apps/web/**"
      - "apps/backend/**"
      - "apps/slicer-worker/**"
      - "packages/slicer-contracts/**"
      - "packages/core/**"
      - "tools/slicing-fixtures/**"
      - "tools/catalog-profiles/**"
      - "packages/openapi-client/**"
      - "packages/ui-web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".nvmrc"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths: *web-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "web: lint, typecheck, test & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm web:typecheck
      - run: pnpm web:test
      - run: pnpm web:build
      - name: Install Playwright browsers
        run: pnpm -C apps/web exec playwright install chromium --with-deps
      - name: Run browser integration tests
        run: pnpm web:test:e2e

  real-api-browser:
    name: "web: isolated real API browser checkout"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: taven
          POSTGRES_DB: taven_web_browser
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taven"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://taven@127.0.0.1:5432/taven_web_browser
      TAVEN_ENVIRONMENT: development
      TAVEN_REDIS_URL: redis://127.0.0.1:6379
      TAVEN_S3_ENDPOINT: http://localhost:9000
      TAVEN_S3_PUBLIC_ENDPOINT: http://localhost:9000
      TAVEN_S3_REGION: us-east-1
      TAVEN_S3_BUCKET: taven-web-browser
      TAVEN_S3_ACCESS_KEY_ID: taven-web-browser
      TAVEN_S3_SECRET_ACCESS_KEY: taven-web-browser-local-only
      TAVEN_S3_FORCE_PATH_STYLE: "true"
      TAVEN_UPLOAD_CLIENT_HASH_KEY: browser-fixture-upload-client-hash-key-32
      TAVEN_AUTOMATIC_PRICE_LIST_REVISION: automatic-v0-czk
      TAVEN_BINDING_QUOTE_FLOWS_ENABLED: "true"
      TAVEN_QUOTE_PHOTO_UPLOADS_ENABLED: "true"
      TAVEN_CHECKOUT_PAYMENT_FLOWS_ENABLED: "true"
      TAVEN_CLAIM_WINDOW_DAYS: "30"
      TAVEN_PAYMENT_PROVIDER: sandbox
      TAVEN_PAYMENT_SANDBOX_PUBLIC_URL: http://localhost:3001
      TAVEN_PUBLIC_SITE_URL: http://localhost:3000
      TAVEN_QUOTE_CAPABILITY_KEY: browser-fixture-quote-capability-key-32
      TAVEN_PAYMENT_SANDBOX_WEBHOOK_SECRET: browser-fixture-webhook-secret-key-32
      CORS_ORIGINS: http://localhost:3000
      PORT: "3001"
      NUXT_PUBLIC_AUTOMATIC_QUOTE_ENABLED: "true"
      NUXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NUXT_API_BASE_URL: http://localhost:3001
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
      INTEGRATION_TEST: "true"
      INTEGRATION_REQUIRE_CHECKOUT: "true"
      INTEGRATION_COMPLETE_PAYMENT: "true"
      INTEGRATION_API_URL: http://localhost:3001
      INTEGRATION_WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated MinIO bucket
        run: |
          docker run --detach --name taven-minio-web-browser --publish 9000:9000 \
            --env MINIO_ROOT_USER="$TAVEN_S3_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$TAVEN_S3_SECRET_ACCESS_KEY" \
            --env MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:3000 \
            quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 \
            -c "mc alias set local '$TAVEN_S3_ENDPOINT' '$TAVEN_S3_ACCESS_KEY_ID' '$TAVEN_S3_SECRET_ACCESS_KEY' && mc mb 'local/$TAVEN_S3_BUCKET'"
      - run: pnpm -C apps/backend db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - name: Publish test-only legal drafts in the isolated database
        run: >-
          pnpm -C apps/backend exec tsx -e
          'import { publishE2eLegalFixturesForDatabase } from "./test/support/publish-e2e-legal-fixtures.ts";
          void publishE2eLegalFixturesForDatabase(process.env.DATABASE_URL!).catch((error) => {
          console.error(error); process.exitCode = 1; });'
      - run: pnpm -C apps/backend build
      - run: pnpm -C apps/slicer-worker build
      - run: pnpm -C apps/web build
      - run: pnpm -C apps/web exec playwright install chromium --with-deps
      - name: Run browser through API, storage, queue, fixture slicing and capture
        run: |
          set -euo pipefail
          DOTENV_CONFIG_PATH=apps/backend/.env.example node apps/backend/dist/main.js > "$RUNNER_TEMP/taven-api.log" 2>&1 &
          api_pid=$!
          DOTENV_CONFIG_PATH=apps/backend/.env.example node apps/backend/dist/slicing-dispatch-worker.js > "$RUNNER_TEMP/taven-dispatch.log" 2>&1 &
          dispatch_pid=$!
          node apps/slicer-worker/scripts/fixture-consumer.mjs > "$RUNNER_TEMP/taven-fixture-worker.log" 2>&1 &
          fixture_pid=$!
          NITRO_PORT=3000 NITRO_HOST=localhost node apps/web/.output/server/index.mjs > "$RUNNER_TEMP/taven-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$dispatch_pid" "$fixture_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3001/health > /dev/null &&
               curl --fail --silent http://localhost:3000/ > /dev/null &&
               grep -q 'isolated fixture slicing ready' "$RUNNER_TEMP/taven-fixture-worker.log"; then break; fi
            if [ "$attempt" -eq 60 ]; then
              tail -40 "$RUNNER_TEMP/taven-api.log" "$RUNNER_TEMP/taven-dispatch.log" "$RUNNER_TEMP/taven-fixture-worker.log" "$RUNNER_TEMP/taven-web.log"
              exit 1
            fi
            sleep 1
          done
          pnpm -C apps/web exec playwright test e2e/integration/real-api-journey.spec.ts --project=integration
