name: Packages CI

on:
  push:
    branches: [main]
    paths: &package-paths
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".nvmrc"
      - ".github/workflows/packages-ci.yml"
  pull_request:
    branches: [main]
    paths: *package-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "packages: lint, typecheck, test & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" -r --if-present run lint
      - run: pnpm --filter "./packages/**" -r --if-present run typecheck
      - run: pnpm --filter "./packages/**" -r --if-present run test
      - run: pnpm --filter "./packages/**" -r --if-present run build
