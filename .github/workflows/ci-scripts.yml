# ported from Studio81Labs/nexcue@314cec8972589780072e641591b16eca9805d7dd
name: CI Scripts

on:
  push:
    branches: [main]
    paths: &ci-paths
      - "scripts/ci/**"
      - ".github/workflows/**"
      - "package.json"
  pull_request:
    branches: [main]
    paths: *ci-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: "ci: repository policy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/check-workflow-coverage.mjs
      - run: node scripts/ci/check-boundaries.mjs
      - run: node scripts/ci/assert-local-database-url.mjs --self-test
      - name: Python policy checks
        run: |
          set -euo pipefail
          python_deps="$RUNNER_TEMP/sibling-drift-python-deps"
          python3 -m pip install \
            --quiet \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --target "$python_deps" \
            --requirement scripts/ci/sibling-drift-requirements.txt
          echo "PYTHONPATH=$python_deps" >> "$GITHUB_ENV"
          export PYTHONPATH="$python_deps"
          python3 scripts/ci/check-pnpm-overrides.py --self-test
          python3 scripts/ci/check-pnpm-overrides.py
          python3 scripts/ci/check-sibling-drift.py --self-test
          python3 scripts/ci/prune-stale-caches.test.py

      - name: Every suite is wired
        run: |
          set -euo pipefail
          missing=0
          for f in scripts/ci/*.test.sh scripts/ci/*.test.py; do
            [[ -e "$f" ]] || continue
            grep -q "$(basename "$f")" .github/workflows/ci-scripts.yml || {
              echo "::error::${f} is not run by this workflow"
              missing=1
            }
          done
          for f in scripts/ci/*.py; do
            grep -q -- "--self-test" "$f" || continue
            grep -q "$(basename "$f") --self-test" .github/workflows/ci-scripts.yml || {
              echo "::error::${f} declares --self-test but this workflow does not run it"
              missing=1
            }
          done
          for f in scripts/ci/*.mjs; do
            [[ -e "$f" ]] || continue
            grep -q -- "--self-test" "$f" || continue
            grep -q "node ${f} --self-test" .github/workflows/ci-scripts.yml || {
              echo "::error::${f} declares --self-test but this workflow does not run it"
              missing=1
            }
          done
          exit "$missing"
