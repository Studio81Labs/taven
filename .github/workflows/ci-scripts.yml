# ported from Studio81Labs/nexcue@314cec8972589780072e641591b16eca9805d7dd
name: CI Scripts

on:
  push:
    branches: [main]
    paths: &ci-paths
      - "scripts/ci/**"
      - ".github/workflows/**"
      - "package.json"
  pull_request:
    branches: [main]
    paths: *ci-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: "ci: repository policy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/check-workflow-coverage.mjs
      - run: node scripts/ci/check-boundaries.mjs
      - run: node scripts/ci/assert-local-database-url.mjs --self-test
      - name: Python policy checks
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install \
              --quiet \
              --disable-pip-version-check \
              --no-deps \
              --only-binary=:all: \
              --require-hashes \
              --requirement scripts/ci/sibling-drift-requirements.txt
          python3 scripts/ci/check-pnpm-overrides.py --self-test
          python3 scripts/ci/check-pnpm-overrides.py
          python3 scripts/ci/check-sibling-drift.py --self-test
