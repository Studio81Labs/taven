name: Slicer Worker CI

on:
  push:
    branches: [main]
    paths: &worker-paths
      - "apps/slicer-worker/**"
      - "packages/slicer-contracts/**"
      - "tools/slicing-fixtures/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".nvmrc"
      - ".github/workflows/slicer-worker-ci.yml"
  pull_request:
    branches: [main]
    paths: *worker-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "worker: lint, typecheck, test & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm slicer-worker:lint
      - run: pnpm slicer-worker:typecheck
      - run: pnpm slicer-worker:test
      - run: pnpm slicer-worker:build

  runtime:
    name: "worker: pinned Orca runtime & corpus"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm slicer-worker:profiles:check
      - run: pnpm slicer-worker:orca:build
      - run: pnpm slicer-worker:orca:test
