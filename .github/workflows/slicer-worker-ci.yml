name: Slicer Worker CI

on:
  push:
    branches: [main]
    paths: &worker-paths
      - "apps/slicer-worker/**"
      - "apps/backend/scripts/seed.ts"
      - "infra/**"
      - "packages/slicer-contracts/**"
      - "scripts/ci/check-boundaries.mjs"
      - "scripts/ci/check-workflow-coverage.mjs"
      - "tools/slicing-fixtures/**"
      - "tools/catalog-profiles/**"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".nvmrc"
      - ".github/workflows/slicer-worker-ci.yml"
  pull_request:
    branches: [main]
    paths: *worker-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "worker: lint, typecheck, test & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm slicer-worker:lint
      - run: pnpm slicer-worker:typecheck
      - run: pnpm slicer-worker:test
      - run: pnpm slicer-worker:build
      - run: pnpm slicer-worker:identity:check
      - run: pnpm stack:config:check

  runtime:
    name: "worker: pinned Orca runtime & corpus"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - run: pnpm slicer-worker:profiles:check
      - run: pnpm catalog-profiles:check
      - run: pnpm slicer-worker:orca:build
      - run: pnpm slicer-worker:orca:test
      - name: Record broker LSM boundary
        env:
          COMPOSE_PROJECT_NAME: taven-runtime-lsm
        run: |
          docker info --format 'SecurityOptions: {{json .SecurityOptions}}'
          compose_args=(-f infra/docker/docker-compose.yml -f infra/docker/docker-compose.local.yml --profile worker)
          # GitHub-hosted Docker blocks user namespaces for ordinary containers.
          # Run this CI-only broker container privileged so the boundary is still
          # exercised; the production Compose service remains non-privileged and
          # requires the host user-namespace prerequisite documented above.
          # The outer user namespace is bootstrapped by root because the
          # hosted Docker daemon disables unprivileged user namespaces in its
          # initial namespace; the runner still drops to UID 10001 before
          # invoking Bubblewrap inside that namespace.
          docker compose "${compose_args[@]}" up slicer-volume-init
          container="$(docker run --detach --privileged \
            --name taven-runtime-lsm-orca-runner \
            --init \
            --user 0:10001 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --cap-add SYS_ADMIN \
            --cap-add SETUID \
            --cap-add SETGID \
            --cap-add SETPCAP \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m,uid=10001,gid=10001,mode=0770 \
            --tmpfs /work:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0770 \
            --security-opt no-new-privileges:true \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --pids-limit 320 \
            --volume "${COMPOSE_PROJECT_NAME}_slicerexchange:/var/run/taven-orca" \
            --env TAVEN_ORCA_RUNNER_ROOT=/var/run/taven-orca \
            --env TAVEN_SLICER_MAX_ARTIFACT_BYTES=536870912 \
            --env TAVEN_SLICER_MAX_DIAGNOSTIC_BYTES=1048576 \
            --entrypoint /bin/sh \
            taven/orca-slicer:2.4.2-fixtures \
            -ec '
              set -eu
              /usr/bin/unshare --user --fork --keep-caps /bin/sh -ec "while [ ! -e /tmp/taven-userns-ready ]; do sleep 0.01; done; exec /bin/sh /usr/local/bin/taven-orca-runner" &
              launcher=$!
              for i in $(seq 1 100); do
                children=$(cat "/proc/$launcher/task/$launcher/children" 2>/dev/null || true)
                [ -n "$children" ] && break
                sleep 0.01
              done
              child=${children%% *}
              printf "0 0 65536\\n" > "/proc/$child/uid_map"
              printf "0 0 65536\\n" > "/proc/$child/gid_map"
              touch /tmp/taven-userns-ready
              wait "$launcher"
            ')"
          cleanup() {
            if [ -n "${container:-}" ]; then
              docker rm -f "$container" >/dev/null 2>&1 || true
            fi
            docker compose "${compose_args[@]}" down --volumes --remove-orphans
          }
          trap cleanup EXIT
          test -n "$container"
          docker inspect "$container" --format 'AppArmorProfile: {{.AppArmorProfile}}'
          test "$(docker inspect "$container" --format '{{.AppArmorProfile}}')" = "unconfined"
          fixture_root="$RUNNER_TEMP/taven-worker-reference-gcode"
          export FIXTURE_ROOT="$fixture_root"
          node --input-type=module <<'NODE'
          import { cp, mkdir, readFile, writeFile } from "node:fs/promises";
          import path from "node:path";

          const root = process.env.FIXTURE_ROOT;
          const profiles = path.join(root, "profiles");
          await Promise.all([
            mkdir(path.join(profiles, "settings"), { recursive: true }),
            mkdir(path.join(profiles, "filaments"), { recursive: true }),
            cp(
              "tools/slicing-fixtures/fixtures/single-pla/cube.stl",
              path.join(root, "geometry.stl"),
            ),
            cp(
              "tools/catalog-profiles/resolved/machine.json",
              path.join(profiles, "settings", "0.json"),
            ),
            cp(
              "tools/catalog-profiles/resolved/filament-pla.json",
              path.join(profiles, "filaments", "0.json"),
            ),
          ]);
          const processPreset = JSON.parse(
            await readFile("tools/catalog-profiles/resolved/process.json", "utf8"),
          );
          Object.assign(
            processPreset,
            {
              brim_width: "0",
              enable_support: "0",
              layer_height: "0.2",
              sparse_infill_density: "10%",
            },
            {
              elefant_foot_compensation: "0",
              xy_contour_compensation: "0",
              xy_hole_compensation: "0",
            },
          );
          await Promise.all([
            writeFile(path.join(profiles, "settings", "1.json"), JSON.stringify(processPreset)),
            writeFile(path.join(root, "copies"), "1\n"),
            writeFile(path.join(root, "artifact-format"), "gcode\n"),
            writeFile(path.join(root, "timeout-seconds"), "120\n"),
          ]);
          NODE
          docker exec "$container" /bin/sh -ec '
            /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups \
              --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
              /bin/rm -rf /var/run/taven-orca/request-identity
            /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups \
              --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
              /bin/mkdir -m 770 /var/run/taven-orca/request-identity
          '
          (cd "$fixture_root" && tar -cf - *) | docker exec -i "$container" /bin/tar --no-same-owner --no-same-permissions -m -C /var/run/taven-orca/request-identity -xf -
          docker exec "$container" /bin/sh -ec '
            request=/var/run/taven-orca/request-identity
            /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups \
              --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
              /bin/mkdir -m 770 -p "$request/output" "$request/tmp/data"
            /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups \
              --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
              /bin/chmod 770 "$request/tmp"
            touch "$request/ready"
          '
          docker exec "$container" /bin/sh -ec '
            request=/var/run/taven-orca/request-identity
            attempts=0
            while [ ! -f "$request/complete" ] && [ ! -f "$request/failed" ] && [ "$attempts" -lt 1250 ]; do
              sleep 0.1
              attempts=$((attempts + 1))
            done
            if [ ! -f "$request/complete" ]; then
              printf "Broker fixture did not complete after %s attempts\n" "$attempts" >&2
              find "$request" -maxdepth 2 -printf "%M %u:%g %p\n" >&2
              for diagnostic in failure-code diagnostics engine-return-code; do
                if [ -f "$request/$diagnostic" ]; then
                  printf "\n--- %s ---\n" "$diagnostic" >&2
                  cat "$request/$diagnostic" >&2
                fi
              done
              exit 1
            fi
          '
          docker exec "$container" /bin/tar -C /var/run/taven-orca/request-identity/output -cf - plate_1.gcode | tar -C "$fixture_root" -xf -
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import path from "node:path";

          const source = await readFile(path.join(process.env.FIXTURE_ROOT, "plate_1.gcode"), "utf8");
          const normalized = source.replace(
            /^(; generated by OrcaSlicer \S+ on )\d{4}-\d{2}-\d{2} at \d{2}:\d{2}:\d{2}$/mu,
            "$1<timestamp>",
          );
          const actual = createHash("sha256").update(normalized).digest("hex");
          const expected = JSON.parse(
            await readFile("tools/slicing-fixtures/expected/worker-reference-gcode.json", "utf8"),
          ).outputs[0].normalizedSha256;
          if (actual !== expected) {
            throw new Error(`Sandboxed fixture hash drifted: expected ${expected}, received ${actual}`);
          }
          NODE
      - name: Configure userns-compatible integration broker
        run: |
          override="$RUNNER_TEMP/taven-worker-ci-compose.yml"
          cat > "$override" <<'YAML'
          services:
            orca-runner:
              privileged: true
              cap_drop: ["ALL"]
              cap_add: ["SYS_ADMIN", "SETUID", "SETGID", "SETPCAP"]
              entrypoint: ["/bin/sh", "-ec"]
              command: |
                set -eu
                /usr/bin/unshare --user --fork --keep-caps /bin/sh -ec "while [ ! -e /tmp/taven-userns-ready ]; do sleep 0.01; done; exec /bin/sh /usr/local/bin/taven-orca-runner" &
                launcher=$!
                for i in $(seq 1 100); do
                  children=$(cat "/proc/$launcher/task/$launcher/children" 2>/dev/null || true)
                  [ -n "$children" ] && break
                  sleep 0.01
                done
                child=${children%% *}
                printf "0 0 65536\\n" > "/proc/$child/uid_map"
                printf "0 0 65536\\n" > "/proc/$child/gid_map"
                touch /tmp/taven-userns-ready
                wait "$launcher"
          YAML
          echo "TAVEN_SLICER_WORKER_COMPOSE_EXTRA_FILE=$override" >> "$GITHUB_ENV"
          echo "TAVEN_SLICER_WORKER_CI_BROKER=1" >> "$GITHUB_ENV"
      - run: pnpm slicer-worker:integration
