name: Slicer Worker CI

on:
  push:
    branches: [main]
    paths: &worker-paths
      - "apps/slicer-worker/**"
      - "apps/backend/scripts/seed.ts"
      - "infra/**"
      - "packages/slicer-contracts/**"
      - "scripts/ci/check-boundaries.mjs"
      - "scripts/ci/check-workflow-coverage.mjs"
      - "tools/slicing-fixtures/**"
      - "tools/catalog-profiles/**"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".nvmrc"
      - ".github/workflows/slicer-worker-ci.yml"
  pull_request:
    branches: [main]
    paths: *worker-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "worker: lint, typecheck, test & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm slicer-worker:lint
      - run: pnpm slicer-worker:typecheck
      - run: pnpm slicer-worker:test
      - run: pnpm slicer-worker:build
      - run: pnpm slicer-worker:identity:check
      - run: pnpm stack:config:check

  runtime:
    name: "worker: pinned Orca runtime & corpus"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - run: pnpm slicer-worker:profiles:check
      - run: pnpm catalog-profiles:check
      - run: pnpm slicer-worker:orca:build
      - run: pnpm slicer-worker:orca:test
      - name: Record broker LSM boundary
        env:
          COMPOSE_PROJECT_NAME: taven-runtime-lsm
        run: |
          docker info --format 'SecurityOptions: {{json .SecurityOptions}}'
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.local.yml --profile worker up -d slicer-volume-init orca-runner
          cleanup() {
            docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.local.yml --profile worker down --volumes --remove-orphans
          }
          trap cleanup EXIT
          container="$(docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.local.yml --profile worker ps -q orca-runner)"
          test -n "$container"
          docker inspect "$container" --format 'AppArmorProfile: {{.AppArmorProfile}}'
          test "$(docker inspect "$container" --format '{{.AppArmorProfile}}')" = "unconfined"
