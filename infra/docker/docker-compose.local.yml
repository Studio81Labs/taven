x-local-payment-environment: &local-payment-environment
  NODE_ENV: development
  # The local stack is the explicitly isolated development/staging test
  # target. Production and the Coolify file keep these gates fail-closed.
  TAVEN_BINDING_QUOTE_FLOWS_ENABLED: ${TAVEN_BINDING_QUOTE_FLOWS_ENABLED:-true}
  TAVEN_QUOTE_PHOTO_UPLOADS_ENABLED: ${TAVEN_QUOTE_PHOTO_UPLOADS_ENABLED:-true}
  TAVEN_CHECKOUT_PAYMENT_FLOWS_ENABLED: ${TAVEN_CHECKOUT_PAYMENT_FLOWS_ENABLED:-true}
  TAVEN_CLAIM_WINDOW_DAYS: ${TAVEN_CLAIM_WINDOW_DAYS:-30}
  TAVEN_PAYMENT_PROVIDER: ${TAVEN_PAYMENT_PROVIDER:-sandbox}
  TAVEN_PAYMENT_SANDBOX_PUBLIC_URL: ${TAVEN_PAYMENT_SANDBOX_PUBLIC_URL:-http://localhost:3001}
  TAVEN_PAYMENT_SANDBOX_WEBHOOK_SECRET: ${TAVEN_PAYMENT_SANDBOX_WEBHOOK_SECRET:-local-only-payment-sandbox-secret-32}
  TAVEN_API_PUBLIC_URL: ${TAVEN_API_PUBLIC_URL:-http://localhost:3001}
  TAVEN_PUBLIC_SITE_URL: ${TAVEN_PUBLIC_SITE_URL:-http://localhost:3000}
  TAVEN_COMGATE_TEST_MODE: ${TAVEN_COMGATE_TEST_MODE:-true}
  TAVEN_COMGATE_API_BASE_URL: ${TAVEN_COMGATE_API_BASE_URL:-https://payments.comgate.cz/v2.0}

services:
  backend:
    environment: *local-payment-environment

  slicing-dispatcher:
    environment: *local-payment-environment

  checkout-payment-worker:
    environment: *local-payment-environment

  operator-auth-expiry-worker:
    environment: *local-payment-environment

  web:
    environment:
      NUXT_PUBLIC_AUTOMATIC_QUOTE_ENABLED: ${NUXT_PUBLIC_AUTOMATIC_QUOTE_ENABLED:-true}
      NUXT_PUBLIC_DEPLOYMENT_ENVIRONMENT: ${TAVEN_ENVIRONMENT:-development}

  storage-contract-minio:
    environment: *local-payment-environment

  storage-contract-garage:
    environment: *local-payment-environment
