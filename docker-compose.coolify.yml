# Preparation only: ingress is disabled. Commercial launch gates remain
# fail-closed by default and are explicitly configurable for an approved,
# isolated development/staging target.
# Raw Compose + Preserve Repository in Coolify; project directory is the repository root.
# Runtime secrets are deliberately absent from build-time interpolation.
x-backend-environment: &id001
  DATABASE_URL: ${DATABASE_URL:-}
  TAVEN_REDIS_URL: ${TAVEN_REDIS_URL:-}
  TAVEN_S3_REGION: ${TAVEN_S3_REGION:-}
  TAVEN_S3_BUCKET: ${TAVEN_S3_BUCKET:-}
  TAVEN_S3_ACCESS_KEY_ID: ${TAVEN_S3_ACCESS_KEY_ID:-}
  TAVEN_S3_SECRET_ACCESS_KEY: ${TAVEN_S3_SECRET_ACCESS_KEY:-}
  TAVEN_S3_FORCE_PATH_STYLE: "true"
  TAVEN_S3_SIGNED_URL_TTL_SECONDS: "900"
  TAVEN_UPLOAD_CLIENT_HASH_KEY: ${TAVEN_UPLOAD_CLIENT_HASH_KEY:-}
  TAVEN_QUOTE_CAPABILITY_KEY: ${TAVEN_QUOTE_CAPABILITY_KEY:-}
  TAVEN_QUOTE_CAPABILITY_PREVIOUS_KEYS: ${TAVEN_QUOTE_CAPABILITY_PREVIOUS_KEYS:-[]}
  TAVEN_ENVIRONMENT: ${TAVEN_ENVIRONMENT:?Configure TAVEN_ENVIRONMENT}
  TAVEN_TRUSTED_PROXY_CIDRS: ${TAVEN_TRUSTED_PROXY_CIDRS:-}
  TAVEN_ADMIN_ORIGINS: ${TAVEN_ADMIN_ORIGINS:-}
  TAVEN_ADMIN_CSRF_KEY: ${TAVEN_ADMIN_CSRF_KEY:-}
  TAVEN_ADMIN_CLIENT_HASH_KEY: ${TAVEN_ADMIN_CLIENT_HASH_KEY:-}
  TAVEN_GITHUB_APP_CLIENT_ID: ${TAVEN_GITHUB_APP_CLIENT_ID:-}
  TAVEN_GITHUB_APP_CLIENT_SECRET: ${TAVEN_GITHUB_APP_CLIENT_SECRET:-}
  TAVEN_GITHUB_APP_CALLBACK_URL: ${TAVEN_GITHUB_APP_CALLBACK_URL:-}
  TAVEN_ADMIN_COMPLETION_URL: ${TAVEN_ADMIN_COMPLETION_URL:-}
  TAVEN_GITHUB_LOGIN_ATTEMPT_ENCRYPTION_KEY: ${TAVEN_GITHUB_LOGIN_ATTEMPT_ENCRYPTION_KEY:-}
  TAVEN_BINDING_QUOTE_FLOWS_ENABLED: ${TAVEN_BINDING_QUOTE_FLOWS_ENABLED:-false}
  TAVEN_QUOTE_PHOTO_UPLOADS_ENABLED: ${TAVEN_QUOTE_PHOTO_UPLOADS_ENABLED:-false}
  TAVEN_CHECKOUT_PAYMENT_FLOWS_ENABLED: ${TAVEN_CHECKOUT_PAYMENT_FLOWS_ENABLED:-false}
  TAVEN_CLAIM_WINDOW_DAYS: ${TAVEN_CLAIM_WINDOW_DAYS:-}
  TAVEN_AUTOMATIC_PRICE_LIST_REVISION: ${TAVEN_AUTOMATIC_PRICE_LIST_REVISION:-automatic-v0-czk}
  TAVEN_PAYMENT_PROVIDER: ${TAVEN_PAYMENT_PROVIDER:-}
  TAVEN_PAYMENT_SANDBOX_PUBLIC_URL: ${TAVEN_PAYMENT_SANDBOX_PUBLIC_URL:-}
  TAVEN_PAYMENT_SANDBOX_WEBHOOK_SECRET: ${TAVEN_PAYMENT_SANDBOX_WEBHOOK_SECRET:-}
  TAVEN_API_PUBLIC_URL: ${TAVEN_API_PUBLIC_URL:-}
  TAVEN_COMGATE_MERCHANT_ID: ${TAVEN_COMGATE_MERCHANT_ID:-}
  TAVEN_COMGATE_SECRET: ${TAVEN_COMGATE_SECRET:-}
  TAVEN_COMGATE_TEST_MODE: ${TAVEN_COMGATE_TEST_MODE:-}
  TAVEN_COMGATE_API_BASE_URL: ${TAVEN_COMGATE_API_BASE_URL:-}
  TAVEN_PUBLIC_SITE_URL: ${TAVEN_PUBLIC_SITE_URL:-}
  TAVEN_S3_ENDPOINT: ${TAVEN_S3_ENDPOINT:-}
  TAVEN_S3_PUBLIC_ENDPOINT: ${TAVEN_S3_PUBLIC_ENDPOINT:-}
  TAVEN_DELIVERY_SELECTOR_MODE: ${TAVEN_DELIVERY_SELECTOR_MODE:-CONFIGURED}
  TAVEN_DELIVERY_ENDPOINTS_JSON: ${TAVEN_DELIVERY_ENDPOINTS_JSON:-}
  TAVEN_PACKETA_WIDGET_ACCOUNT_ID: ${TAVEN_PACKETA_WIDGET_ACCOUNT_ID:-}
  TAVEN_PACKETA_WIDGET_OPTIONS_JSON: ${TAVEN_PACKETA_WIDGET_OPTIONS_JSON:-{}}
services:
  migrate:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/backend-migration:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    restart: "no"
    networks:
      - environment
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
  backend:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/backend:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      <<: *id001
      PORT: "3001"
      CORS_ORIGINS: ${TAVEN_CORS_ORIGINS:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - environment
      - proxy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      - traefik.enable=${TAVEN_PUBLIC_INGRESS_ENABLED:-false}
      - traefik.docker.network=coolify
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-backend.rule=Host(`${TAVEN_API_HOST:-disabled.invalid}`)
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-backend.entrypoints=https
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-backend.tls=true
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-backend.tls.certresolver=letsencrypt
      - traefik.http.services.taven-${TAVEN_ENVIRONMENT}-backend.loadbalancer.server.port=3001
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-backend.service=taven-${TAVEN_ENVIRONMENT}-backend
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
  web:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/web:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      NUXT_API_BASE_URL: http://backend:3001
      NUXT_PUBLIC_API_BASE_URL: ${TAVEN_API_URL:?Configure the API URL}
      NUXT_PUBLIC_SITE_URL: ${TAVEN_PUBLIC_SITE_URL:?Configure the website URL}
      NUXT_PUBLIC_AUTOMATIC_QUOTE_ENABLED: ${NUXT_PUBLIC_AUTOMATIC_QUOTE_ENABLED:-false}
      NUXT_PUBLIC_DEPLOYMENT_ENVIRONMENT: ${TAVEN_ENVIRONMENT:?Configure TAVEN_ENVIRONMENT}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - environment
      - proxy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.enable=${TAVEN_PUBLIC_INGRESS_ENABLED:-false}
      - traefik.docker.network=coolify
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-web.rule=Host(`${TAVEN_WEB_HOST:-disabled.invalid}`)
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-web.entrypoints=https
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-web.tls=true
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-web.tls.certresolver=letsencrypt
      - traefik.http.services.taven-${TAVEN_ENVIRONMENT}-web.loadbalancer.server.port=3000
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-web.service=taven-${TAVEN_ENVIRONMENT}-web
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
  admin:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/admin:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: ${TAVEN_API_URL:?Configure the API URL}
        VITE_APP_ENV: ${TAVEN_ENVIRONMENT:?Configure environment}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:8080/health
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - environment
      - proxy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - traefik.enable=${TAVEN_PUBLIC_INGRESS_ENABLED:-false}
      - traefik.docker.network=coolify
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-admin.rule=Host(`${TAVEN_ADMIN_HOST:-disabled.invalid}`)
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-admin.entrypoints=https
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-admin.tls=true
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-admin.tls.certresolver=letsencrypt
      - traefik.http.services.taven-${TAVEN_ENVIRONMENT}-admin.loadbalancer.server.port=8080
      - traefik.http.routers.taven-${TAVEN_ENVIRONMENT}-admin.service=taven-${TAVEN_ENVIRONMENT}-admin
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 128
  slicing-dispatcher:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/backend:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    command:
      - node
      - dist/slicing-dispatch-worker.js
    environment:
      <<: *id001
      TAVEN_SLICING_DISPATCH_POLL_MILLISECONDS: "1000"
      TAVEN_SLICING_DISPATCH_CLAIM_LIMIT: "25"
    networks:
      - environment
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    profiles:
      - slicing
  checkout-payment-worker:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/backend:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    command:
      - node
      - dist/checkout-payment-worker.js
    environment:
      <<: *id001
    networks:
      - environment
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
  operator-auth-expiry-worker:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/backend:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    command:
      - node
      - dist/operator-auth-expiry-worker.js
    environment:
      <<: *id001
    networks:
      - environment
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
  slicer-worker:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/slicer-worker:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/slicer-worker/Dockerfile
      target: runtime
    init: true
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 320
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,uid=10001,gid=10001,mode=0700
    volumes:
      - slicerexchange:/var/run/taven-orca
    environment:
      TAVEN_REDIS_URL: ${TAVEN_REDIS_URL:-}
      TAVEN_S3_ENDPOINT: ${TAVEN_S3_ENDPOINT:-}
      TAVEN_S3_REGION: ${TAVEN_S3_REGION:-}
      TAVEN_S3_BUCKET: ${TAVEN_S3_BUCKET:-}
      TAVEN_S3_ACCESS_KEY_ID: ${TAVEN_S3_ACCESS_KEY_ID:-}
      TAVEN_S3_SECRET_ACCESS_KEY: ${TAVEN_S3_SECRET_ACCESS_KEY:-}
      TAVEN_S3_FORCE_PATH_STYLE: "true"
      TAVEN_ORCA_RUNNER_ROOT: /var/run/taven-orca
    networks:
      - environment
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    profiles:
      - slicing
    depends_on:
      orca-runner:
        condition: service_started
    mem_limit: 384m
    cpus: 0.5
  slicer-volume-init:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/orca-slicer:${SOURCE_COMMIT:?Pin the deployed commit}
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/slicer-worker/Orca.Dockerfile
      target: runtime
      platforms:
        - linux/amd64
    user: 0:0
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown 0:0 /var/run/taven-orca && chmod 0770 /var/run/taven-orca && for request in /var/run/taven-orca/request-*; do [ -d "$$request" ] || continue; chown 0:0 "$$request" && chown -R 0:0 "$$request" && rm -rf "$$request"; done; chown 10001:10001 /var/run/taven-orca
    volumes:
      - slicerexchange:/var/run/taven-orca
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    profiles:
      - slicing
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 128
  orca-runner:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/orca-slicer:${SOURCE_COMMIT:?Pin the deployed commit}
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/slicer-worker/Orca.Dockerfile
      target: runtime
      platforms:
        - linux/amd64
    init: true
    user: 0:10001
    working_dir: /
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    pids_limit: 320
    entrypoint:
      - /bin/sh
      - /usr/local/bin/taven-orca-runner
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,uid=10001,gid=10001,mode=0770
      - /work:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0770
    environment:
      TAVEN_ORCA_RUNNER_ROOT: /var/run/taven-orca
      TAVEN_SLICER_MAX_ARTIFACT_BYTES: "536870912"
      TAVEN_SLICER_MAX_DIAGNOSTIC_BYTES: "1048576"
    volumes:
      - slicerexchange:/var/run/taven-orca
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    profiles:
      - slicing
    depends_on:
      slicer-volume-init:
        condition: service_completed_successfully
    mem_limit: 2g
    cpus: 2.0
    configs:
      - source: orca-runner
        target: /usr/local/bin/taven-orca-runner
        mode: 292
  balance-payment-deadline-worker:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/backend:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    command:
      - node
      - dist/balance-payment-deadline-worker.js
    environment:
      <<: *id001
    networks:
      - environment
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
  resource-reservation-expiry-worker:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/backend:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    command:
      - node
      - dist/resource-reservation-expiry-worker.js
    environment:
      <<: *id001
    networks:
      - environment
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
  retention-worker:
    image: taven/${TAVEN_ENVIRONMENT:?Choose staging or production}/backend:${SOURCE_COMMIT:?Pin the deployed commit}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    command:
      - node
      - dist/retention-worker.js
    environment:
      <<: *id001
    networks:
      - environment
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
networks:
  environment:
    external: true
    name: taven-${TAVEN_ENVIRONMENT:?Configure environment}
  proxy:
    external: true
    name: coolify
volumes:
  slicerexchange:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1073741824,uid=10001,gid=10001,mode=0770,noexec,nosuid,nodev
configs:
  orca-runner:
    file: ./apps/slicer-worker/orca-runner.sh
